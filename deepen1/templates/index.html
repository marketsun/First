<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>검색 크롤러</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- 헤더 -->
    <header class="header">
        <div class="header-content">
            <h1 class="logo">🔍 검색 크롤러</h1>
            <div class="header-actions">
                <a href="/history" class="history-link">검색 기록</a>
                <button class="settings-btn" onclick="openSettingsModal()">⚙️ 설정</button>
            </div>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <div class="main-container">
        <!-- 검색 영역 -->
        <div class="search-section">
            <div class="search-box compact-layout">
                <input 
                    type="text" 
                    id="search-keyword" 
                    class="search-input compact" 
                    placeholder="검색 키워드"
                    onkeypress="if(event.key === 'Enter') handleSearch()"
                >
                <button id="search-btn" class="search-button compact" onclick="handleSearch()">
                    검색
                </button>
                <button id="copy-links-btn" class="copy-links-button" onclick="copyAllLinks()">
                    링크복사
                </button>
                
                <!-- 관련검색어 토글 스위치 -->
                <div class="related-search-toggle">
                    <span class="toggle-label">관련검색어</span>
                    <div class="toggle-switch" id="related-search-toggle" onclick="toggleRelatedSearch()">
                        <div class="toggle-slider"></div>
                    </div>
                </div>
            </div>
            
            <!-- 진행 상태 -->
            <div id="progress-container" class="progress-container" style="display: none;">
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill">0%</div>
                </div>
                <div id="status-message" class="status-message">준비 중...</div>
            </div>
        </div>

        <!-- 필터 영역 (결과가 있을 때만 표시) -->
        <div id="filter-section" class="filter-section" style="display: none;">
            <div class="filter-container">
                <div class="filter-item">
                    <input type="text" id="filter-keyword" class="filter-input" placeholder="키워드 필터">
                </div>
                <div class="filter-item">
                    <input type="date" id="filter-date-from" class="filter-input">
                </div>
                <div class="filter-item">
                    <input type="date" id="filter-date-to" class="filter-input">
                </div>
                <div class="filter-item">
                    <select id="filter-sort" class="filter-input">
                        <option value="">기본 순서</option>
                        <option value="view_desc">조회수 높은순</option>
                        <option value="view_asc">조회수 낮은순</option>
                        <option value="date_desc">최신순</option>
                        <option value="date_asc">오래된순</option>
                    </select>
                </div>
                <button class="filter-btn" onclick="applyFilters()">적용</button>
                <button class="filter-btn-reset" onclick="resetFilters()">초기화</button>
            </div>
        </div>

        <!-- 결과 영역 (2분할) -->
        <div id="results-container" class="results-container">
            <!-- 구글 결과 (왼쪽) -->
            <div class="results-column">
                <div class="column-header">
                    <h2 class="column-title">🌐 구글</h2>
                    
                    <!-- 관련검색어 드롭다운 (토글 ON일 때만 표시) -->
                    <div class="related-dropdown-container" id="google-dropdown-container" style="display: none;">
                        <button class="related-dropdown-btn" onclick="toggleDropdown('google')">
                            <span id="google-current-keyword"></span>
                            <span class="dropdown-arrow">▼</span>
                        </button>
                        <div class="dropdown-menu" id="google-dropdown"></div>
                    </div>
                    
                    <!-- 미디어 타입 필터 -->
                    <div class="media-filter-container">
                        <button class="filter-btn active" data-source="google" data-filter="all" onclick="filterMediaType('google', 'all')">전체</button>
                        <button class="filter-btn" data-source="google" data-filter="owned" onclick="filterMediaType('google', 'owned')">온드</button>
                        <button class="filter-btn" data-source="google" data-filter="earned" onclick="filterMediaType('google', 'earned')">언드</button>
                    </div>
                </div>
                <div id="google-results" class="results-list">
                    <div class="result-table">
                        <div class="result-table-header">
                            <div class="result-table-cell position-cell">순서</div>
                            <div class="result-table-cell type-cell">타입</div>
                            <div class="result-table-cell source-cell">출처</div>
                            <div class="result-table-cell title-cell">제목</div>
                            <div class="result-table-cell action-cell" style="margin-left: auto;">
                                <span class="result-count"><span id="google-count">0</span>개</span>
                                <button id="google-screenshot-btn" class="screenshot-btn" onclick="showScreenshot('google')">
                                    📸 페이지보기
                                </button>
                            </div>
                        </div>
                        <div class="empty-state">검색을 시작하세요</div>
                    </div>
                </div>
            </div>

            <!-- 유튜브 결과 (오른쪽) -->
            <div class="results-column">
                <div class="column-header">
                    <h2 class="column-title">🎥 유튜브</h2>
                    
                    <!-- 관련검색어 드롭다운 (토글 ON일 때만 표시) -->
                    <div class="related-dropdown-container" id="youtube-dropdown-container" style="display: none;">
                        <button class="related-dropdown-btn" onclick="toggleDropdown('youtube')">
                            <span id="youtube-current-keyword"></span>
                            <span class="dropdown-arrow">▼</span>
                        </button>
                        <div class="dropdown-menu" id="youtube-dropdown"></div>
                    </div>
                    
                    <!-- 미디어 타입 필터 -->
                    <div class="media-filter-container">
                        <button class="filter-btn active" data-source="youtube" data-filter="all" onclick="filterMediaType('youtube', 'all')">전체</button>
                        <button class="filter-btn" data-source="youtube" data-filter="owned" onclick="filterMediaType('youtube', 'owned')">온드</button>
                        <button class="filter-btn" data-source="youtube" data-filter="earned" onclick="filterMediaType('youtube', 'earned')">언드</button>
                    </div>
                </div>
                <div id="youtube-results" class="results-list">
                    <div class="result-table">
                        <div class="result-table-header">
                            <div class="result-table-cell" style="width: 60px;">순서</div>
                            <div class="result-table-cell" style="width: 100px;">타입</div>
                            <div class="result-table-cell channel-cell">채널명</div>
                            <div class="result-table-cell date-cell sortable" onclick="toggleYoutubeSort('date')">
                                업로드일 <span class="sort-icon active">↓</span><span class="sort-icon">↑</span>
                            </div>
                            <div class="result-table-cell views-cell sortable" onclick="toggleYoutubeSort('views')">
                                조회수 <span class="sort-icon">↓</span><span class="sort-icon">↑</span>
                            </div>
                            <div class="result-table-cell title-cell">제목</div>
                            <div class="result-table-cell action-cell" style="margin-left: auto;">
                                <span class="result-count"><span id="youtube-count">0</span>개</span>
                                <button id="youtube-screenshot-btn" class="screenshot-btn" onclick="showScreenshot('youtube')">
                                    📸 페이지보기
                                </button>
                            </div>
                        </div>
                        <div class="empty-state">검색을 시작하세요</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 로그 버튼 (우측 하단 고정) -->
    <button class="log-button" onclick="toggleLogModal()" title="크롤링 로그">
        📋
    </button>

    <!-- 로그 플로팅 창 -->
    <div id="log-modal" class="log-modal">
        <div class="log-header">
            <div class="log-title">
                <span>📋</span>
                <span>크롤링 로그</span>
            </div>
            <div class="log-actions">
                <button class="log-action-btn log-copy-btn" onclick="copyLogs(event)">전체 복사</button>
                <button class="log-action-btn log-close-btn" onclick="toggleLogModal()">닫기</button>
            </div>
        </div>
        <div id="log-content" class="log-content">
            <div class="log-empty">
                <div class="log-empty-icon">📋</div>
                <div>아직 크롤링 로그가 없습니다</div>
            </div>
        </div>
    </div>

    <!-- 스크린샷 모달 -->
    <div id="screenshot-modal" class="screenshot-modal">
        <div class="screenshot-overlay" onclick="closeScreenshot()"></div>
        <div class="screenshot-content">
            <div class="phone-bezel">
                <div class="phone-screen">
                    <img id="screenshot-image" src="" alt="스크린샷">
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        let currentSearchId = null;
        let currentCrawlId = null;
        let relatedSearchEnabled = false;
        let currentScreenshots = {
            google: null,
            youtube: null
        };
        let currentZoom = 100; // 확대/축소 비율
        
        // 관련검색어 데이터
        let currentSearchData = null;  // 전체 검색 데이터
        let currentKeyword = '';  // 현재 검색 키워드
        let currentDisplayedResults = {
            google: { keyword: '', results: [], screenshot: null },
            youtube: { keyword: '', results: [], screenshot: null }
        };

        // 관련검색어 토글 함수
        function toggleRelatedSearch() {
            const toggle = document.getElementById('related-search-toggle');
            relatedSearchEnabled = !relatedSearchEnabled;
            
            if (relatedSearchEnabled) {
                toggle.classList.add('active');
                console.log('[토글] 관련검색어 활성화');
            } else {
                toggle.classList.remove('active');
                console.log('[토글] 관련검색어 비활성화');
            }
        }

        // 스크린샷 보기
        function showScreenshot(type) {
            const modal = document.getElementById('screenshot-modal');
            const image = document.getElementById('screenshot-image');
            const phoneBezel = document.querySelector('.phone-bezel');
            
            const screenshotUrl = currentScreenshots[type];
            
            if (!screenshotUrl) {
                showAlert('스크린샷이 없습니다.', 'error');
                return;
            }
            
            // 이미지 로드
            image.src = screenshotUrl;
            
            // 줌 초기화
            currentZoom = 100;
            updateZoom();
            
            // 위치 클래스 설정
            modal.classList.remove('google', 'youtube');
            modal.classList.add(type);  // 'google' 또는 'youtube'
            
            // 모달 표시
            modal.classList.add('show');
            
            // 이벤트 리스너 추가 (한 번만)
            if (!phoneBezel.hasAttribute('data-zoom-listener')) {
                // Shift + 스크롤로 확대/축소
                phoneBezel.addEventListener('wheel', handleZoomScroll, { passive: false });
                
                // 더블클릭으로 150% 토글
                image.addEventListener('dblclick', handleDoubleClick);
                
                phoneBezel.setAttribute('data-zoom-listener', 'true');
            }
        }

        // 스크린샷 모달 닫기
        function closeScreenshot() {
            const modal = document.getElementById('screenshot-modal');
            modal.classList.remove('show');
        }


        // ESC 키로 스크린샷 모달 닫기
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeScreenshot();
            }
        });

        // 줌 레벨 업데이트
        function updateZoom() {
            const phoneBezel = document.querySelector('.phone-bezel');
            if (phoneBezel) {
                phoneBezel.style.transform = `scale(${currentZoom / 100})`;
            }
        }

        // Shift + 스크롤로 확대/축소
        function handleZoomScroll(event) {
            if (event.shiftKey) {
                event.preventDefault();
                
                const delta = event.deltaY;
                
                if (delta < 0) {
                    // 위로 스크롤 = 확대
                    if (currentZoom < 200) {
                        currentZoom += 5;
                        updateZoom();
                    }
                } else {
                    // 아래로 스크롤 = 축소
                    if (currentZoom > 50) {
                        currentZoom -= 5;
                        updateZoom();
                    }
                }
            }
        }

        // 더블클릭으로 150% 토글
        function handleDoubleClick() {
            if (currentZoom === 100) {
                currentZoom = 150;
            } else {
                currentZoom = 100;
            }
            updateZoom();
        }
        
        // 드롭다운 열기/닫기
        function toggleDropdown(type) {
            const dropdown = document.getElementById(`${type}-dropdown`);
            const btn = dropdown.previousElementSibling;
            
            // 다른 드롭다운 닫기
            const otherType = type === 'google' ? 'youtube' : 'google';
            const otherDropdown = document.getElementById(`${otherType}-dropdown`);
            const otherBtn = otherDropdown.previousElementSibling;
            otherDropdown.classList.remove('show');
            otherBtn.classList.remove('open');
            
            // 현재 드롭다운 토글
            dropdown.classList.toggle('show');
            btn.classList.toggle('open');
        }
        
        // 관련검색어 선택
        async function selectRelated(type, keyword) {
            // 키워드 정규화
            keyword = keyword.trim();
            
            // 디버깅 로그
            console.log('=== selectRelated 디버깅 ===');
            console.log('타입:', type);
            console.log('선택한 키워드:', keyword);
            console.log('currentSearchData:', currentSearchData);
            console.log(`${type}_related_results:`, currentSearchData[`${type}_related_results`]);
            
            // 드롭다운 닫기
            const dropdown = document.getElementById(`${type}-dropdown`);
            const btn = dropdown.previousElementSibling;
            dropdown.classList.remove('show');
            btn.classList.remove('open');
            
            // 버튼 텍스트 변경
            document.getElementById(`${type}-current-keyword`).textContent = keyword;
            
            // 활성화 상태 변경
            const items = dropdown.querySelectorAll('.dropdown-item');
            items.forEach(item => {
                item.classList.remove('active');
                if (item.textContent.trim() === keyword) {
                    item.classList.add('active');
                }
            });
            
            // 로딩 표시
            showAlert(`"${keyword}" 결과 로딩 중...`, 'info');
            
            // 결과 표시
            let results, screenshot;
            
            if (keyword === currentKeyword) {
                // 원본 검색어
                results = currentSearchData[`${type}_results`];
                screenshot = currentSearchData[`${type}_screenshot`];
                console.log('원본 검색어 - results 개수:', results?.length);
                console.log('원본 검색어 - screenshot:', screenshot);
            } else {
                // 관련검색어
                const relatedData = currentSearchData[`${type}_related_results`]?.[keyword];
                
                console.log('relatedData:', relatedData);
                
                if (!relatedData) {
                    console.error('❌ 관련검색어 데이터를 찾을 수 없습니다:', keyword);
                    console.log('사용 가능한 키워드:', Object.keys(currentSearchData[`${type}_related_results`] || {}));
                    showAlert('데이터를 불러올 수 없습니다.', 'error');
                    return;
                }
                
                results = relatedData.results;
                screenshot = relatedData.screenshot;
                
                console.log('관련검색어 - results 개수:', results?.length);
                console.log('관련검색어 - screenshot:', screenshot);
            }
            
            // 현재 표시 중인 결과 저장
            currentDisplayedResults[type] = { keyword, results, screenshot };
            
            // 화면 업데이트
            console.log('displayResults 호출 전 - type:', type, 'keyword:', keyword, 'results:', results?.length, 'screenshot:', screenshot);
            await displayResults(type, keyword, results, screenshot);
        }
        
        // 결과 표시 함수
        async function displayResults(type, keyword, results, screenshot) {
            // 스크린샷 업데이트
            currentScreenshots[type] = screenshot;
            
            // 결과 렌더링 (기존 UI 형식 유지)
            if (type === 'google') {
                const googleResults = document.getElementById('google-results');
                
                if (results && results.length > 0) {
                    googleResults.innerHTML = `
                        <div class="result-table">
                            <div class="result-table-header">
                                <div class="result-table-cell position-cell">순서</div>
                                <div class="result-table-cell type-cell">타입</div>
                                <div class="result-table-cell source-cell">출처</div>
                                <div class="result-table-cell title-cell">제목</div>
                                <div class="result-table-cell action-cell" style="margin-left: auto;">
                                    <span class="result-count"><span id="google-count">${results.length}</span>개</span>
                                    <button id="google-screenshot-btn" class="screenshot-btn" onclick="showScreenshot('google')">
                                        📸 페이지보기
                                    </button>
                                </div>
                            </div>
                            ${results.map((result, index) => {
                                const typeLabel = result.result_type || '일반';
                                const typeClass = typeLabel === '이미지' ? 'type-cell image' : 'type-cell';
                                const source = result.source || result.snippet || extractDomainName(result.url);
                                const mediaType = result.media_type || 'earned';
                                
                                // 디버깅: 첫 3개 결과의 media_type 출력
                                if (index < 3) {
                                    console.log(`[API 응답] 구글 결과 ${index + 1}:`, {
                                        title: result.title,
                                        media_type: result.media_type,
                                        mediaType: mediaType
                                    });
                                }
                                
                                return `
                                    <div class="result-table-row" data-media-type="${mediaType}">
                                        <div class="result-table-cell position-cell">${result.position}</div>
                                        <div class="result-table-cell ${typeClass}">${typeLabel}</div>
                                        <div class="result-table-cell source-cell">${source}</div>
                                        <div class="result-table-cell title-cell">
                                            <a href="${result.url}" target="_blank">${result.title}</a>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `;
                } else {
                    googleResults.innerHTML = `
                        <div class="result-table">
                            <div class="result-table-header">
                                <div class="result-table-cell position-cell">순서</div>
                                <div class="result-table-cell type-cell">타입</div>
                                <div class="result-table-cell source-cell">출처</div>
                                <div class="result-table-cell title-cell">제목</div>
                                <div class="result-table-cell action-cell" style="margin-left: auto;">
                                    <span class="result-count"><span id="google-count">0</span>개</span>
                                    <button id="google-screenshot-btn" class="screenshot-btn" onclick="showScreenshot('google')">
                                        📸 페이지보기
                                    </button>
                                </div>
                            </div>
                            <div class="empty-state"><div class="empty-state-icon">🔍</div><div class="empty-state-text">검색 결과가 없습니다.</div></div>
                        </div>
                    `;
                }
                
            } else if (type === 'youtube') {
                // 유튜브 결과 렌더링 (main.js의 renderYoutubeResults 사용)
                originalYoutubeData = results || [];
                youtubeSortState = { date: 'desc', views: null }; // 정렬 상태 초기화
                renderYoutubeResults(originalYoutubeData);
            }
        }
        
        async function handleSearch() {
            const keyword = document.getElementById('search-keyword').value.trim();
            
            if (!keyword) {
                showAlert('키워드를 입력해주세요.', 'error');
                return;
            }
            
            // 필터 숨기기
            document.getElementById('filter-section').style.display = 'none';
            
            // 크롤링 시작
            await performSearch(keyword);
        }

        // performSearch 함수 오버라이드
        async function performSearch(keyword) {
            const searchBtn = document.getElementById('search-btn');
            const googleResults = document.getElementById('google-results');
            const youtubeResults = document.getElementById('youtube-results');
            
            // 검색 버튼 비활성화
            searchBtn.disabled = true;
            
            // 각 결과창에 로딩 스피너 표시
            googleResults.innerHTML = `
                <div class="result-table">
                    <div class="result-table-header">
                        <div class="result-table-cell position-cell">순서</div>
                        <div class="result-table-cell type-cell">타입</div>
                        <div class="result-table-cell source-cell">출처</div>
                        <div class="result-table-cell title-cell">제목</div>
                        <div class="result-table-cell action-cell" style="margin-left: auto;">
                            <span class="result-count"><span id="google-count">0</span>개</span>
                            <button id="google-screenshot-btn" class="screenshot-btn" onclick="showScreenshot('google')">
                                📸 페이지보기
                            </button>
                        </div>
                    </div>
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>검색 중...</p>
                    </div>
                </div>
            `;
            
            youtubeResults.innerHTML = `
                <div class="result-table">
                    <div class="result-table-header">
                        <div class="result-table-cell" style="width: 60px;">순서</div>
                        <div class="result-table-cell" style="width: 100px;">타입</div>
                        <div class="result-table-cell channel-cell">채널명</div>
                        <div class="result-table-cell date-cell sortable" onclick="toggleYoutubeSort('date')">
                            업로드일 <span class="sort-icon active">↓</span><span class="sort-icon">↑</span>
                        </div>
                        <div class="result-table-cell views-cell sortable" onclick="toggleYoutubeSort('views')">
                            조회수 <span class="sort-icon">↓</span><span class="sort-icon">↑</span>
                        </div>
                        <div class="result-table-cell title-cell">제목</div>

        // 로그 업데이트
        let logUpdateInterval = null;
        
        function startLogUpdates(crawlId) {
            // 기존 인터벌 정리
            if (logUpdateInterval) {
                clearInterval(logUpdateInterval);
            }
            
            console.log('[로그 업데이트] 시작:', crawlId);
            
            // 로그 업데이트 시작
            logUpdateInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/logs/${crawlId}`);
                    const data = await response.json();
                    
                    console.log('[로그 업데이트] 받은 로그 개수:', data.logs ? data.logs.length : 0);
                    
                    const logContent = document.getElementById('log-content');
                    
                    if (data.logs && data.logs.length > 0) {
                        // HTML 이스케이프 처리
                        const escapeHtml = (text) => {
                            const div = document.createElement('div');
                            div.textContent = text;
                            return div.innerHTML;
                        };
                        
                        logContent.innerHTML = data.logs.map((log, index) => {
                            let className = 'log-line';
                            if (log.includes('완료') || log.includes('성공')) {
                                className += ' success';
                            } else if (log.includes('오류') || log.includes('실패') || log.includes('Error')) {
                                className += ' error';
                            } else if (log.includes('시작') || log.includes('중...')) {
                                className += ' info';
                            }
                            return `<div class="${className}" data-index="${index}">${escapeHtml(log)}</div>`;
                        }).join('');
                        
                        // 자동 스크롤 (최신 로그가 보이도록)
                        logContent.scrollTop = logContent.scrollHeight;
                    } else {
                        console.log('[로그 업데이트] 로그가 비어있음');
                    }
                } catch (error) {
                    console.error('로그 업데이트 오류:', error);
                }
            }, 1000);
        }

            if (!currentCrawlId) {

                return;

                const response = await fetch(`/api/logs/${currentCrawlId}`);
                const data = await response.json();
                
                if (data.logs && data.logs.length > 0) {
                    const logText = data.logs.join('\n');
                    await navigator.clipboard.writeText(logText);
                    
                    // 복사 완료 피드백

                    btn.textContent = '✓ 복사 완료!';

        // 미디어 타입 필터링
        function filterMediaType(source, filterType) {
            console.log(`🔍 필터링: ${source} - ${filterType}`);
            
            // 버튼 활성화 상태 변경
            const buttons = document.querySelectorAll(`.filter-btn[data-source="${source}"]`);
            buttons.forEach(btn => {
                if (btn.dataset.filter === filterType) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            // 결과 행 필터링
            const resultsContainer = document.getElementById(`${source}-results`);
            const rows = resultsContainer.querySelectorAll('.result-table-row');
            
            console.log(`📊 총 ${rows.length}개 행 발견`);
            
            let visibleCount = 0;
            const mediaTypeCounts = { owned: 0, earned: 0, undefined: 0 };
            
            rows.forEach((row, index) => {
                const mediaType = row.dataset.mediaType;
                
                // 디버깅: 첫 3개 행의 mediaType 출력
                if (index < 3) {
                    console.log(`행 ${index + 1}: mediaType = "${mediaType}"`);
                }
                
                // 통계
                if (mediaType === 'owned') mediaTypeCounts.owned++;
                else if (mediaType === 'earned') mediaTypeCounts.earned++;
                else mediaTypeCounts.undefined++;
                
                if (filterType === 'all') {
                    // 전체 표시
                    row.classList.remove('filtered-hidden');
                    visibleCount++;
                } else if (mediaType === filterType) {
                    // 해당 타입만 표시
                    row.classList.remove('filtered-hidden');
                    visibleCount++;
                } else {
                    // 숨김
                    row.classList.add('filtered-hidden');
                }
            });
            
            console.log(`📊 미디어 타입 분포:`, mediaTypeCounts);
            
            // 갯수 업데이트
            const countElem = document.getElementById(`${source}-count`);
            if (countElem) {
                countElem.textContent = visibleCount;
            }
            
            console.log(`✅ ${source} 필터링 완료: ${visibleCount}개 표시`);
        }

        // ==================== 온드미디어 설정 ====================
        
        // 설정 모달 열기
        function openSettingsModal() {
            document.getElementById('settings-modal').style.display = 'flex';
            loadOwnedMediaSettings();
        }
        
        // 설정 모달 닫기
        function closeSettingsModal() {
            document.getElementById('settings-modal').style.display = 'none';
        }
        
        // 설정 불러오기
        function loadOwnedMediaSettings() {
            const domains = JSON.parse(localStorage.getItem('ownedDomains') || '[]');
            const channels = JSON.parse(localStorage.getItem('ownedChannels') || '[]');
            
            const domainList = document.getElementById('owned-domains-list');
            const channelList = document.getElementById('owned-channels-list');
            
            // 도메인 목록 렌더링
            domainList.innerHTML = domains.map((domain, index) => `
                <div class="settings-item">
                    <span>${domain}</span>
                    <button class="remove-btn" onclick="removeDomain(${index})">×</button>
                </div>
            `).join('');
            
            // 채널 목록 렌더링
            channelList.innerHTML = channels.map((channel, index) => `
                <div class="settings-item">
                    <span>${channel}</span>
                    <button class="remove-btn" onclick="removeChannel(${index})">×</button>
                </div>
            `).join('');
        }
        
        // 도메인 추가
        function addDomain() {
            const input = document.getElementById('domain-input');
            const domain = input.value.trim();
            
            if (!domain) {
                alert('도메인을 입력하세요.');
                return;
            }
            
            const domains = JSON.parse(localStorage.getItem('ownedDomains') || '[]');
            
            if (domains.includes(domain)) {
                alert('이미 등록된 도메인입니다.');
                return;
            }
            
            domains.push(domain);
            localStorage.setItem('ownedDomains', JSON.stringify(domains));
            input.value = '';
            loadOwnedMediaSettings();
        }
        
        // 도메인 삭제
        function removeDomain(index) {
            const domains = JSON.parse(localStorage.getItem('ownedDomains') || '[]');
            domains.splice(index, 1);
            localStorage.setItem('ownedDomains', JSON.stringify(domains));
            loadOwnedMediaSettings();
        }
        
        // 채널 추가
        function addChannel() {
            const input = document.getElementById('channel-input');
            const channel = input.value.trim();
            
            if (!channel) {
                alert('채널명을 입력하세요.');
                return;
            }
            
            const channels = JSON.parse(localStorage.getItem('ownedChannels') || '[]');
            
            if (channels.includes(channel)) {
                alert('이미 등록된 채널입니다.');
                return;
            }
            
            channels.push(channel);
            localStorage.setItem('ownedChannels', JSON.stringify(channels));
            input.value = '';
            loadOwnedMediaSettings();
        }
        
        // 채널 삭제
        function removeChannel(index) {
            const channels = JSON.parse(localStorage.getItem('ownedChannels') || '[]');
            channels.splice(index, 1);
            localStorage.setItem('ownedChannels', JSON.stringify(channels));
            loadOwnedMediaSettings();
        }
        
        // 설정 저장 (닫기)
        function saveSettings() {
            alert('설정이 저장되었습니다.\n다음 검색부터 적용됩니다.');
            closeSettingsModal();
        }
        
        // Enter 키로 추가
        document.addEventListener('DOMContentLoaded', function() {
            const domainInput = document.getElementById('domain-input');
            const channelInput = document.getElementById('channel-input');
            
            if (domainInput) {
                domainInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') addDomain();
                });
            }
            
            if (channelInput) {
                channelInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') addChannel();
                });
            }
        });
    </script>
    
    <!-- 설정 모달 -->
    <div id="settings-modal" class="settings-modal">
        <div class="settings-modal-content">
            <div class="settings-modal-header">
                <h2>⚙️ 온드미디어 설정</h2>
                <button class="close-btn" onclick="closeSettingsModal()">×</button>
            </div>
            
            <div class="settings-modal-body">
                <!-- 도메인 설정 -->
                <div class="settings-section">
                    <h3>📌 온드미디어 도메인 목록</h3>
                    <p class="settings-description">등록된 도메인을 포함하는 URL은 온드미디어로 분류됩니다.</p>
                    
                    <div class="settings-input-group">
                        <input 
                            type="text" 
                            id="domain-input" 
                            class="settings-input" 
                            placeholder="예: samsung.com, moadamda.com"
                        >
                        <button class="add-btn" onclick="addDomain()">+ 추가</button>
                    </div>
                    
                    <div id="owned-domains-list" class="settings-list">
                        <!-- 도메인 목록이 여기에 렌더링됩니다 -->
                    </div>
                </div>
                
                <!-- 채널 설정 -->
                <div class="settings-section">
                    <h3>📺 유튜브 온드 채널명</h3>
                    <p class="settings-description">등록된 채널명을 포함하는 유튜브 채널은 온드미디어로 분류됩니다.</p>
                    
                    <div class="settings-input-group">
                        <input 
                            type="text" 
                            id="channel-input" 
                            class="settings-input" 
                            placeholder="예: 삼성전자, 모아담다 공식"
                        >
                        <button class="add-btn" onclick="addChannel()">+ 추가</button>
                    </div>
                    
                    <div id="owned-channels-list" class="settings-list">
                        <!-- 채널 목록이 여기에 렌더링됩니다 -->
                    </div>
                </div>
            </div>
            
            <div class="settings-modal-footer">
                <button class="cancel-btn" onclick="closeSettingsModal()">취소</button>
                <button class="save-btn" onclick="saveSettings()">저장</button>
            </div>
        </div>
    </div>
</body>
</html>
